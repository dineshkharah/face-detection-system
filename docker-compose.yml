services:
  backend:
    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - db

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  db:
    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: face_db

    ports:
      - "5432:5432"
